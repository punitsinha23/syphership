name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: syphership
          POSTGRES_PASSWORD: syphership
          POSTGRES_DB: syphership_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syphership"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      POSTGRES_USER: syphership
      POSTGRES_PASSWORD: syphership
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: syphership
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdefghijklmnop

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npx eslint src

      - name: Build
        run: npm run build

  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend for production
        working-directory: frontend
        env:
          VITE_API_URL: https://api.syphership.duckdns.org
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy the backend
        run: ssh -i ~/.ssh/deploy_key root@${{ secrets.SSH_HOST }} "cd /opt/syphership && git fetch --quiet origin main && git reset --hard ${{ github.sha }} && bash scripts/deploy.sh ${{ github.sha }}"


      - name: Upload the frontend
        run: rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" frontend/dist/ root@${{ secrets.SSH_HOST }}:/var/www/syphership/

      - name: Check the live site
        run: |
          curl -fsS https://api.syphership.duckdns.org/ready
          curl -fsS -o /dev/null https://syphership.duckdns.org/

