services:

  postgres:

    image: postgres:15-alpine

    container_name: syphership-postgres

    environment:

      POSTGRES_DB: ${POSTGRES_DB}

      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:

      - "127.0.0.1:${POSTGRES_PORT}:5432"

    volumes:

      - syphership-postgres-data:/var/lib/postgresql/data

  redis:

    image: redis:7-alpine

    container_name: syphership-redis

    # Write every change to disk, so queued jobs and acks survive a restart.
    command: redis-server --appendonly yes

    ports:
    # Localhost only: deployed apps can reach the host at 172.17.0.1, not 127.0.0.1.

      - "127.0.0.1:6379:6379"

    volumes:

      - syphership-redis-data:/data

  # Build workers. Not started by a plain "docker compose up"; run them with
  # docker compose --profile workers up --build --scale worker=2
  worker:

    profiles: ["workers"]

    build:

      context: services/api

      dockerfile: worker/Dockerfile

    env_file: .env

    # Host network: Postgres, Redis and the deployed apps' ports (127.0.0.1)
    # are reachable at localhost, the same as when the worker runs locally.
    network_mode: host

    volumes:

      # Builds and runs deployments on the host's Docker.
      - /var/run/docker.sock:/var/run/docker.sock

    # Let the current build finish on "docker stop" (build timeout is 10 min).
    stop_grace_period: 15m

    depends_on:

      - postgres

      - redis

volumes:

  syphership-postgres-data:

  syphership-redis-data: