services:

  postgres:

    image: postgres:15-alpine

    container_name: syphership-postgres

    environment:

      POSTGRES_DB: ${POSTGRES_DB}

      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:

      - "127.0.0.1:${POSTGRES_PORT}:5432"

    volumes:

      - syphership-postgres-data:/var/lib/postgresql/data
    
    restart: unless-stopped

  redis:

    image: redis:7-alpine

    container_name: syphership-redis

    # Write every change to disk, so queued jobs and acks survive a restart.
    command: redis-server --appendonly yes

    ports:
    # Localhost only: deployed apps can reach the host at 172.17.0.1, not 127.0.0.1.

      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    volumes:

      - syphership-redis-data:/data
    
    restart: unless-stopped

  # Build workers. Not started by a plain "docker compose up"; run them with
  # docker compose --profile workers up --build --scale worker=2
  worker:

    profiles: ["workers"]

    build:

      context: services/api

      dockerfile: worker/Dockerfile

    env_file: .env

    # Host network: Postgres, Redis and the deployed apps' ports (127.0.0.1)
    # are reachable at localhost, the same as when the worker runs locally.
    network_mode: host

    volumes:

      # Builds and runs deployments on the host's Docker.
      - /var/run/docker.sock:/var/run/docker.sock

      # Caddy's config, so the worker can write app routes (services/app_routes.py).
      # On the server set CADDY_DIR=/etc/caddy in .env; locally an unused ./.caddy is made.
      - ${CADDY_DIR:-./.caddy}:/etc/caddy

      # Caddy's per-app access logs, read-only: their timestamps show when an
      # app was last used (services/idle_apps.py). Server: CADDY_LOG_DIR=/var/log/caddy/apps
      - ${CADDY_LOG_DIR:-./.caddy-logs}:/var/log/caddy/apps:ro

    # Let the current build finish on "docker stop" (build timeout is 10 min).
    stop_grace_period: 15m

    depends_on:

      - postgres

      - redis

    restart: unless-stopped

  # API server. Only for the server; on your laptop you still use "make api".
  # Start it with: docker compose --profile prod up -d --build
  api:

    profiles: ["prod"]

    # Same image as the worker: Python 3.14 and all of services/api.
    build:

      context: services/api

      dockerfile: worker/Dockerfile

    command: ["uvicorn", "main:app", "--host", "127.0.0.1", "--port", "8000"]

    env_file: .env

    # Localhost only: Caddy is the public entry point and proxies to 127.0.0.1:8000.
    network_mode: host

    # No docker.sock here: the API doesn't build or run containers.

    restart: unless-stopped

    depends_on:

      - postgres

      - redis

volumes:

  syphership-postgres-data:

  syphership-redis-data:
