services:

  postgres:

    image: postgres:15-alpine

    container_name: syphership-postgres

    environment:

      POSTGRES_DB: ${POSTGRES_DB}

      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:

      - "${POSTGRES_PORT}:5432"

    volumes:

      - syphership-postgres-data:/var/lib/postgresql/data

  redis:

    image: redis:7-alpine

    container_name: syphership-redis

    ports:

      - "6379:6379"

volumes:

  syphership-postgres-data: