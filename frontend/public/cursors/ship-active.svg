<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Hover variant: same ship and hotspot (6, 6), cyan hull and engines at full thrust -->
  <g transform="rotate(-45 16 16)">
    <!-- engine flame, longer than the idle ship -->
    <path d="M13.6 24 L16 31.5 L18.4 24 Z" fill="#22D3EE" opacity="0.45"/>
    <path d="M14.5 24 L16 28.5 L17.5 24 Z" fill="#F5F7FA"/>
    <!-- fins -->
    <path d="M12.2 16.5 L7.5 23.5 L12 22.2 Z" fill="#0891B2" stroke="#070A0F" stroke-width="1" stroke-linejoin="round"/>
    <path d="M19.8 16.5 L24.5 23.5 L20 22.2 Z" fill="#0891B2" stroke="#070A0F" stroke-width="1" stroke-linejoin="round"/>
    <!-- hull -->
    <path d="M16 1.5 C19.6 5.5 20.8 11.5 20.3 23.5 L11.7 23.5 C11.2 11.5 12.4 5.5 16 1.5 Z"
          fill="#67E8F9" stroke="#070A0F" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- hull shading -->
    <path d="M16 3 C18.6 6.5 19.4 12 19.1 22.5 L16 22.5 Z" fill="#22D3EE" opacity="0.5"/>
    <!-- cockpit window -->
    <circle cx="16" cy="10.5" r="2.2" fill="#070A0F" stroke="#F5F7FA" stroke-width="0.9"/>
  </g>
</svg>
